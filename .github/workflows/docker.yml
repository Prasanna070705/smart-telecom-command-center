# Builds the Docker image on Linux (amd64), starts it with compose, and runs the API test, browser test and timing
# against the container. Complements windows.yml; together they cover Windows, Linux/amd64 and (locally) macOS/arm64.
name: docker
on:
  push:
    branches: [v2]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build and start the container
        run: |
          mkdir -m 777 results      # the container runs as uid 1000; the runner's checkout belongs to another uid
          docker compose up --build --detach
          docker image ls smart-telecom-command-center:local --format 'image size: {{.Size}}'

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do s=$(docker inspect --format '{{.State.Health.Status}}' $(docker compose ps -q app)); echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 3; done
          docker compose logs; exit 1

      - name: API test against the container
        run: |
          npm ci
          npm run test:api 2>&1 | tee api-test.log
          for w in 'fibre -17.89 churn ceiling' 'same pattern: true +U--UUUUUU' 'engine2 matches reference: true' 'matches G9/G10: true' \
                   'finished jobs saved to disk: true' 'status 200 cancelled | again 409' 'invalid haircut status 400'; do
            grep -qF "$w" api-test.log || { echo "test:api: missing '$w'"; exit 1; }
          done

      - name: Browser test against the container
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Timing (informational)
        run: npm run timing || echo "::warning::timing over the demo-laptop budgets on this runner (informational)"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color > container.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-logs
          path: |
            *.log
          if-no-files-found: ignore
